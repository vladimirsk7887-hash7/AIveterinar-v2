<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо — AI-ветеринар · Цифровая приёмная 24/7</title>
<meta name="description" content="Демо цифровой приёмной AI-ветеринар: опишите симптом питомца и получите оценку срочности и рекомендации 24/7.">
<link rel="icon" href="/favicon.svg">
<style>
  :root{
    --bg-dark:#0F172A; --bg-lighter:#1E293B; --text-main:#F1F5F9; --text-muted:#CBD5E1;
    --primary:#3B82F6; --primary-strong:#1D4ED8; --success:#10B981; --danger:#EF4444; --warning:#F59E0B;
    --border:#2B3A52;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg-dark);color:var(--text-main);
    display:flex;flex-direction:column;min-height:100dvh;
  }
  header{
    display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);
    background:var(--bg-lighter);position:sticky;top:0;z-index:5;
  }
  header .logo{width:38px;height:38px;border-radius:10px;background:var(--primary);
    display:grid;place-items:center;font-size:20px;flex:none}
  header h1{font-size:16px;margin:0;font-weight:700}
  header p{font-size:12px;margin:2px 0 0;color:var(--text-muted)}
  header a.back{margin-left:auto;color:var(--text-muted);text-decoration:none;font-size:13px;
    border:1px solid var(--border);padding:8px 12px;border-radius:9px}
  header a.back:hover{color:var(--text-main);border-color:var(--primary)}

  main{flex:1;overflow-y:auto;padding:20px 16px;max-width:760px;width:100%;margin:0 auto}
  .msg{display:flex;margin-bottom:14px;gap:10px;line-height:1.5}
  .msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:15px}
  .msg.bot .av{background:var(--primary)}
  .msg.user{flex-direction:row-reverse}
  .msg.user .av{background:var(--bg-lighter);border:1px solid var(--border)}
  .bubble{padding:11px 14px;border-radius:12px;max-width:82%;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
  .msg.bot .bubble{background:var(--bg-lighter);border:1px solid var(--border);border-top-left-radius:3px}
  .msg.user .bubble{background:var(--primary-strong);color:#fff;border-top-right-radius:3px}
  .bubble b{color:var(--text-main)}
  .bubble h3{font-size:14.5px;margin:10px 0 4px}
  .bubble ul{margin:6px 0;padding-left:18px}
  .msg.bot .bubble h3{color:var(--primary)}
  .typing span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;
    background:var(--text-muted);animation:blink 1.2s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .quick{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:8px}
  .quick button{background:var(--bg-lighter);color:var(--text-muted);border:1px solid var(--border);
    padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit}
  .quick button:hover{color:var(--text-main);border-color:var(--primary)}

  footer{border-top:1px solid var(--border);background:var(--bg-lighter);padding:12px 16px}
  .inrow{max-width:760px;margin:0 auto;display:flex;gap:10px}
  .inrow textarea{flex:1;resize:none;background:var(--bg-dark);color:var(--text-main);
    border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-family:inherit;font-size:14.5px;
    max-height:120px;line-height:1.4}
  .inrow textarea:focus{outline:none;border-color:var(--primary)}
  .inrow button{background:var(--primary-strong);color:#fff;border:none;border-radius:11px;padding:0 20px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;flex:none}
  .inrow button:disabled{opacity:.5;cursor:default}
  .note{max-width:760px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--text-muted)}
</style>
</head>
<body>
  <header>
    <div class="logo">🐾</div>
    <div>
      <h1>AI-ветеринар — демо приёмной</h1>
      <p>Цифровая приёмная 24/7 · оценка срочности</p>
    </div>
    <a class="back" href="/">← На сайт</a>
  </header>

  <main id="chat"></main>

  <div class="quick" id="quick">
    <button>Кот чихает второй день, ест нормально</button>
    <button>Собака отказывается от еды и вялая</button>
    <button>Щенок съел шоколад, что делать?</button>
  </div>

  <footer>
    <div class="inrow">
      <textarea id="input" rows="1" placeholder="Опишите, что беспокоит вашего питомца…"></textarea>
      <button id="send">Отправить</button>
    </div>
    <div class="note">Демо-версия. Не заменяет очный осмотр ветеринара. В экстренном случае обратитесь в клинику.</div>
  </footer>

<script>
const SYSTEM = `Ты — AI-ассистент цифровой приёмной ветеринарной клиники. Твоя задача: принять обращение владельца животного, задать при необходимости ОДИН уточняющий вопрос, оценить срочность (плановая / в ближайшие 24-48 часов / срочно к врачу) и дать безопасные бытовые рекомендации.
Правила: не ставь диагнозы и не назначай лечение/препараты. Проверяй «красные флаги» (одышка, судороги, кровотечение, отравление, вздутие живота, отказ от воды, травма) — при них указывай, что нужна СРОЧНАЯ очная помощь. Отвечай кратко, тёплым понятным языком, по-русски. Структурируй: краткий вывод о срочности, затем что наблюдать/сделать дома, затем когда обратиться к врачу.`;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const quick = document.getElementById('quick');
const history = [];

function mdToHtml(t){
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g,'');
}
function bubble(role, html, cls){
  const m=document.createElement('div'); m.className='msg '+role;
  m.innerHTML='<div class="av">'+(role==='bot'?'🐾':'🙂')+'</div><div class="bubble '+(cls||'')+'">'+html+'</div>';
  chat.appendChild(m); chat.scrollTop=chat.scrollHeight; return m;
}
bubble('bot','Здравствуйте! Я помощник ветеринарной приёмной. Опишите, что беспокоит вашего питомца — оценю срочность и подскажу, что делать. 🐾');

async function ask(text){
  if(!text.trim()) return;
  quick.style.display='none';
  bubble('user', mdToHtml(text));
  history.push({role:'user',content:text});
  input.value=''; input.style.height='auto'; sendBtn.disabled=true;
  const t=bubble('bot','<span class="typing"><span></span><span></span><span></span></span>');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:SYSTEM,messages:history,max_tokens:600})});
    const data=await r.json();
    const answer = data.text || data.error || 'Извините, не удалось получить ответ. Попробуйте ещё раз.';
    t.querySelector('.bubble').innerHTML=mdToHtml(answer);
    if(data.text) history.push({role:'assistant',content:data.text});
  }catch(e){
    t.querySelector('.bubble').textContent='Ошибка связи. Проверьте интернет и попробуйте снова.';
  }finally{ sendBtn.disabled=false; chat.scrollTop=chat.scrollHeight; input.focus(); }
}

sendBtn.onclick=()=>ask(input.value);
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value);} });
input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
quick.querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));
</script>
</body>
</html>
